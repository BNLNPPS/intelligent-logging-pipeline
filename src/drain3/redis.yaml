apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: drain3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:7
        command: ["redis-server", "--save", "", "--stop-writes-on-bgsave-error", "no"] 
        ports:
        - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: drain3
spec:
  selector:
    app: redis
  ports:
  - port: 6379
    targetPort: 6379
